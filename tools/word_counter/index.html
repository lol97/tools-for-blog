<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> TolFoBlog - Word Counter</title>
  <link rel="stylesheet" href="/assets/bootstrap-5.3.3-dist/css/bootstrap.min.css">
  <script src="/assets/bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <!-- Navbar -->
  <!-- Navbar -->
  <section id="nav_cust">
  </section>

  <div class="container-fluid mt-3">
    <div class="card">
      <div class="card-header">
        <h3 class="text-center">Word Counter</h3>
      </div>
      <div class="card-body">
        <div class="mb-3">
          <label for="text-input" class="form-label">Enter your text:</label>
          <textarea class="form-control" id="text-input" rows="5"></textarea>
        </div>
        <div class="text-center">
          <button class="btn btn-primary" id="count-words">Re-Count Words</button>
        </div>
        <div class="mt-3">
          <h5>Total Words: <span id="word-count">0</span></h5>
        </div>
      </div>
    </div>
  </div>

  <script src="/script/jquery-3.7.1.min.js"></script>
  <script src="/script/TolFoBlog.js"></script>
  <script src="/tools/word_counter/word-counter.js"></script>
</body>
</html>
